      x-permissions: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationTokenRedeem'
            examples:
              reset:
                summary: Set a new password
                value: {purpose: password_reset, token: vt_Qk3m9ZpL2xR7bN1c, newPassword: 'Toeic-900-goal!'}
              verify:
                summary: Verify email
                value: {purpose: email_verification, token: vt_A8d2KfP0sW5yH3jE}
      responses:
        '204':
          description: Token redeemed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

