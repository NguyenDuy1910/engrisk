          items:
            type: object
            required:
              - startMs
              - endMs
              - text
            properties:
              startMs:
                type: integer
              endMs:
                type: integer
              text:
                type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    SpeechSynthesisJobCreate:
      type: object
      description: Multi-voice TTS for a listening group or section track; creates a new `question_media` asset (synthetic) + suggested cues. Never mutates content.
      required:
        - type
        - target
        - scriptSource
        - voices
        - output
      properties:
        type:
          type: string
          const: speech_synthesis
        target:
          description: '`{type: audio_track, examId, revisionId, sectionKey}` or `{type: question_group, groupId}`.'
          oneOf:
            - type: object
              required:
                - type
                - examId
                - revisionId
                - sectionKey
              properties:
                type:
                  type: string
                  const: audio_track
                examId:
                  $ref: '#/components/schemas/Uuid'
                revisionId:
                  $ref: '#/components/schemas/Uuid'
                sectionKey:
                  $ref: '#/components/schemas/SectionKey'
              additionalProperties: false
            - type: object
              required:
                - type
                - groupId
              properties:
                type:
                  type: string
                  const: question_group
                groupId:
                  $ref: '#/components/schemas/Uuid'
              additionalProperties: false
        scriptSource:
          type: string
          enum:
            - track_script
            - group_transcript
            - inline
        segments:
          type: array
          items:
            type: object
            required:
              - speaker
              - text
            properties:
              speaker:
                type: string
              text:
                type: string
              pauseAfterMs:
                type: integer
                minimum: 0
            additionalProperties: false
          description: Required when scriptSource=inline.
        voices:
          type: object
          description: speakerLabel → voiceId (from reference data `speechVoices`).
          additionalProperties:
            type: string
          minProperties: 1
        output:
          type: object
          required:
            - format
            - sampleRateHz
          properties:
            format:
              type: string
              enum:
                - wav
                - mp3
            sampleRateHz:
              type: integer
              enum:
                - 44100
                - 48000
          additionalProperties: false
      additionalProperties: false
    SpeechSynthesisResult:
      type: object
      description: New synthetic audio asset + timed script + suggested cues (apply via PUT audio-tracks / PATCH question-groups).
      required:
        - type
        - assetId
        - durationMs
        - suggestedCues
        - scriptSegments
      properties:
        type:
          type: string
          const: speech_synthesis
