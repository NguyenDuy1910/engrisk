    QuestionGroupCreatePart3:
      summary: TOEIC Part 3 conversation with 3 questions (atomic)
      value:
        examType: toeic_lr
        stimulusType: audio
        title: Conversation 32–34 · Meeting room change
        content:
          stimulusType: audio
          instructions: Questions 32 through 34 refer to the following conversation.
        audioAssetId: 6e2a8c4d-0f91-4b37-a8e5-2d9c7f1b3e84
        transcript: |-
          M1(US): Excuse me, is this the right floor for the budget meeting?
          W1(UK): Yes, but it has been moved to Room 405 because the projector here is broken.
          M1(US): Thanks. I should let my manager know — she is bringing the quarterly figures.
