  /me/identities:
    post:
      tags:
      - Me
      operationId: postMeIdentities
      summary: Link identity provider to existing user
      x-phase: P1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      x-permissions:
      - session
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLink'
  /me/identities/{provider}:
    delete:
      tags:
      - Me
      operationId: deleteMeIdentitiesProvider
      summary: Unlink identity provider
      x-phase: P1
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      description: Disallow removing the final usable authentication method.
      x-permissions:
      - session
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
  /tenants/current:
    get:
      tags:
      - Tenants
      operationId: getTenantsCurrent
      summary: Get current tenant
      x-phase: P4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'
