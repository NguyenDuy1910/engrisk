                  assetId: 1d4f7a2e-8c35-4b91-a6e0-5f2b9c3d7e18
                  kind: image
                  mimeType: image/png
                  width: 512
                  height: 512
                  url: https://media.engrisk.app/public/branding/1d4f7a2e.png
                  urlExpiresAt:
                  rangeSupported: true
                  alt: Sunrise English Center logo
                accentColor: '#E8590C'
        '304':
          description: Not modified.
        '404':
          $ref: '#/components/responses/NotFound'

  /tutor-conversations:
    get:
      operationId: listTutorConversations
      tags:
        - Tutor
      summary: List my tutor conversations
      description: Own conversations, most recent first (no messages).
      x-phase: P1
      x-permissions:
        - registered
        - entitlement:ai_tutor
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTutorConversation
      tags:
        - Tutor
      summary: Start a tutor conversation
      description: 'Context must be review-disclosed to the caller (practice checked or attempt submitted) else `403 tutor.context_not_reviewable`. With `initialMessage` the reply is enqueued (`replyJobId`). Quota → `ai.quota_exceeded` 429. `question` context: allowed only for questions already disclosed to the caller (submitted attempt or checked practice position) or for authoring staff of the owning tenant; otherwise `403 tutor.context_not_reviewable`.'
      x-phase: P1
      x-permissions:
        - registered
        - entitlement:ai_tutor
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorConversationCreate'
            examples:
              explainAnswer:
                $ref: '#/components/examples/TutorCreate'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /tutor-conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    get:
      operationId: getTutorConversation
      tags:
        - Tutor
      summary: Get a tutor conversation
      description: Conversation + latest 50 messages; `before` cursor for older; AI `quota`.
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - name: before
          in: query
          required: false
          description: Cursor (from `messagesBefore`) for older messages.
          schema:
            type: string
      responses:
        '200':
          description: Conversation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tutor-conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
    post:
      operationId: sendTutorMessage
      tags:
        - Tutor
      summary: Send a message to the tutor
      description: 'Stores the learner message and enqueues a `tutor_reply` job; the reply arrives as a tutor message (P1: poll `GET /jobs/{jobId}` then `GET /tutor-conversations/{conversationId}`; P2 optional: SSE `delta` via streamJobEvents). Idempotency-Key required. Quota → 429.'
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorMessageCreate'
            examples:
              followUp:
                $ref: '#/components/examples/TutorMessage'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorMessageAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /tutor-conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      - $ref: '#/components/parameters/MessageIdPath'
    patch:
      operationId: rateTutorMessage
      tags:
        - Tutor
      summary: Rate a tutor message
      description: 'Learner helpfulness rating on a tutor message (`learnerRating: -1|1`).'
      x-phase: P1
      x-permissions:
        - owner
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TutorMessageRating'
      responses:
        '200':
          description: Rated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token (15 min). Claims: `sub` userId, `sid` sessionId, `tid` activeTenantId, `knd` guest|registered, `ver` permission version.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: engrisk_rt
      description: 'Web refresh token cookie (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth). Requires `X-Requested-With: engrisk`.'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Locale for resolved strings and problem titles.
      schema:
        $ref: '#/components/schemas/Locale'
    AssetIdPath:
      name: assetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AttemptIdPath:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: Client platform/version (e.g. `web/1.4.0`, `ios/1.2.0`); used for `426` upgrade gating.
      schema: {type: string, pattern: '^(web|ios|android)/[0-9]+\.[0-9]+\.[0-9]+$'}
    CommentIdPath:
      name: commentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConversationIdPath:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous `nextCursor`.
      schema: {type: string, maxLength: 512}
    ExamIdPath:
      name: examId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExamTypeCodePath:
      name: examTypeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExamTypeCode'
    ExamTypeQuery:
      name: examType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExamTypeCode'
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated UUID; replays within 24 h return the original response with `Idempotent-Replayed: true`.'
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client UUID making the POST safely retryable (required for `method=guest` on `createSession`).
      schema:
        $ref: '#/components/schemas/Uuid'
    IdentityProviderPath:
      name: provider
      in: path
      required: true
      schema: {type: string, enum: [password, google], x-extensible-enum: true}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the representation being modified. Missing → 428; mismatch → 412.
      schema: {type: string, example: '"r-1730105400-7f3a"'}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag for conditional GET (304), or `*` for create-if-absent on PUT.
      schema: {type: string}
    ImportIdPath:
      name: importId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationIdPath:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    MaterialIdPath:
      name: materialId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MessageIdPath:
      name: messageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    QuestionIdPath:
      name: questionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RevisionIdPath:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SectionKeyPath:
      name: sectionKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SectionKey'
    SortQuery:
      name: sort
      in: query
      required: false
      description: Field name from the endpoint's allow-list; prefix `-` for descending.
      schema: {type: string, pattern: '^-?[a-zA-Z]+$'}
    SubmissionIdPath:
      name: submissionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantSlugPath:
      name: tenantSlug
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  headers:
    Deprecation:
      description: RFC 9745 deprecation date of the operation.
      schema: {type: string}
    ETag:
      description: Strong entity tag of the returned representation.
      schema: {type: string}
    IdempotentReplayed:
      description: '`true` when the response is a stored replay for the same `Idempotency-Key`.'
      schema: {type: boolean}
    Location:
      description: URI of the created resource or job.
      schema: {type: string, format: uri-reference}
    RateLimit:
      description: 'IETF draft RateLimit header, e.g. `limit=10, remaining=0, reset=42`.'
      schema: {type: string}
    RateLimitPolicy:
      description: 'IETF draft RateLimit-Policy header, e.g. `10;w=60`.'
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before retrying / polling again.
      schema: {type: integer, minimum: 0}
    Sunset:
      description: RFC 8594 removal date (HTTP-date).
      schema: {type: string}
    XRequestId:
      description: Request id (echoed or generated); equals `traceId` in problem bodies.
      schema: {type: string}
  responses:
    BadRequest:
      description: Malformed request (`request.malformed`) or invalid token (`auth.token_invalid`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (domain codes such as `identity.email_taken`, `rating.attempt_required`, `request_in_progress`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.engrisk.app/problems/identity.email_taken
            title: Email đã được sử dụng
            status: 409
            code: identity.email_taken
            traceId: 01JBE7Q4S9M2N6V8X0Z3A5C7EC
    Forbidden:
      description: Caller can see the resource but lacks the permission, entitlement or state (`permission.denied`, `tenant.membership_required`, `exam.access_denied`, …).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.engrisk.app/problems/permission.denied
            title: Bạn không có quyền thực hiện thao tác này
            status: 403
            code: permission.denied
            traceId: 01JBE7Q4S9M2N6V8X0Z3A5C7EA
    Gone:
      description: Expired verification token, invitation or upload (`auth.verification_expired`, `media.upload_expired`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error (`internal_error`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Account temporarily locked after repeated failures (`auth.account_locked`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Unknown id, foreign tenant or not visible to the caller (`resource.not_found`; never 403 for existence).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.engrisk.app/problems/resource.not_found
            title: Resource not found
            status: 404
            code: resource.not_found
            instance: /api/v1/exams/1b2c3d4e-0000-4000-8000-000000000000
            traceId: 01JBE7Q4S9M2N6V8X0Z3A5C7EB
    PayloadTooLarge:
      description: Declared or actual size exceeds the purpose limit (`media.too_large`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` does not match the current ETag (`precondition_failed`); refetch and retry.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` header missing on a concurrency-controlled mutation (`precondition_required`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependency or maintenance outage (`service_unavailable`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limit or AI quota exceeded (`rate_limited`, `ai.quota_exceeded` with `meta {limit, resetsAt}`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/expired access token or invalid credentials (`auth.unauthenticated`, `auth.token_expired`, `auth.invalid_credentials`, `auth.refresh_invalid`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          description: '`Bearer` challenge.'
          schema: {type: string}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.engrisk.app/problems/auth.token_expired
            title: Access token expired
            status: 401
            code: auth.token_expired
            traceId: 01JBE7Q4S9M2N6V8X0Z3A5C7E9
    UnprocessableEntity:
      description: Semantic validation failure (`validation.failed` with `errors[]`, `idempotency_key_reused`, or a domain code).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.engrisk.app/problems/validation.failed
            title: Dữ liệu không hợp lệ
            status: 422
            code: validation.failed
            traceId: 01JBE7Q4S9M2N6V8X0Z3A5C7ED
            errors:
              - {pointer: /password, code: too_short, message: Mật khẩu cần ít nhất 8 ký tự.}
    UpgradeRequired:
      description: Client build no longer supported (`client_upgrade_required`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  examples:
