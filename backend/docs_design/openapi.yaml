    parameters:
      - $ref: '#/components/parameters/AssetIdPath'
    post:
      operationId: completeMediaUpload
      tags:
        - Media
      summary: Complete an upload
      description: 'Uploader only. Completes multipart (with `parts[]`) or HEADs the single object; verifies size and mime. Single PUT: SHA-256 is enforced by storage via the signed `x-amz-checksum-sha256` header, so a mismatch fails the upload itself. Multipart: storage verifies per-part SHA-256 (composite checksum); the whole-object SHA-256 is verified by the processing job, and a mismatch moves the asset to `quarantined` (reason `checksum_mismatch`) instead of failing this call. → `processing` (scan/probe job) or `available` for low-risk purposes. Idempotent: completing an already completed asset returns its current state. Errors: `media.upload_incomplete` 409, `media.checksum_mismatch` 422 (single PUT object present with wrong checksum), `media.size_mismatch` 422, `media.upload_expired` 410.'
