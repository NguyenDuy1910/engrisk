x-guidelines:
  idPolicy:
    userId: 8-digit random bigint represented as JSON string
    otherBigintIds: decimal string
    contentAndMedia: UUID string
    jobs: UUID string
  privacy: Reject any model binding that selects protected answer/transcript fields for catalog or attempt delivery.
  multiTenant: Tenant chosen by signed session. Never trust client tenantId for resource access.
  jobCreation: 'No public generic POST /jobs: each domain operation validates its own typed input and creates jobs
    internally.'
  idempotency: Implement replay safety for domain POSTs; do not persist refresh tokens or replay authentication
    secrets in generic response caches.
  versioning: Writes to content versions allowed only in draft state; published graphs cannot mutate.
  attemptSnapshot: Pin served content/versions and occurrence identity, not just a root item reference.
  nonApi: No endpoints for underlying role_permissions, AI invocation logs, or internal worker leases without an
    explicit product requirement.
