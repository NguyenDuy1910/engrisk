          type:
            - integer
            - 'null'
          minimum: 60
        instantCheck:
          type: boolean
          default: true
        audioReplay:
          type: boolean
          default: true
        transcript:
          type: boolean
          default: true
          description: Disclose transcripts for fully checked groups.
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code, traceId]
