components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from previous page
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of draft/edited resource
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID for safe retry of non-repeatable creation/commands
      schema:
        $ref: '#/components/schemas/Uuid'
  headers:
    ETag:
      description: Current resource revision
      schema:
        type: string
    Location:
      description: Canonical URI of created resource or job
      schema:
        type: string
    RequestId:
      description: Request trace ID
      schema:
        type: string
  schemas:
    Uuid:
      type: string
      format: uuid
    BigintId:
      type: string
      pattern: ^[1-9][0-9]*$
      description: 'PostgreSQL BIGINT: serialized as a decimal string to avoid JavaScript precision loss'
    UserId:
      type: string
      pattern: ^[1-9][0-9]{7}$
      description: Random 8-digit numeric user ID, serialized as a string
    IsoDatetime:
      type: string
      format: date-time
    IsoDate:
      type: string
      format: date
    JsonObject:
      type: object
      additionalProperties: true
      description: Typed JSONB object; validated by schemaKey and schemaVersion
    ContentKind:
      type: string
      description: Open code-registry vocabulary, e.g. collection, exam, section, block, stimulus, question, lesson,
        course
    VersionStatus:
      type: string
      enum:
      - draft
      - in_review
      - scheduled
      - published
      - retired
    AttemptStatus:
      type: string
      enum:
      - in_progress
      - submitted
      - completed
      - abandoned
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable domain error identifier
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              message:
                type: string
              code:
                type: string
            required:
            - pointer
            - message
      additionalProperties: true
    PageMeta:
      type: object
      properties:
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: false
      required:
      - nextCursor
    SessionCreate:
      type: object
      properties:
        method:
          type: string
          enum:
          - guest
          - password
          - google
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        idToken:
          type: string
        timezone:
          type: string
        locale:
          type: string
      additionalProperties: false
      required:
      - method
      description: 'Field requirements are conditional on method: password(email,password), google(idToken), guest(no
        credentials).'
    SessionRefresh:
      type: object
      properties:
        refreshToken:
          type: string
          description: Mobile only; web uses HttpOnly cookie
        activeTenantId:
          $ref: '#/components/schemas/BigintId'
      additionalProperties: false
    SessionTokens:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
        refreshToken:
          type: string
          description: Mobile only; omitted on web (HttpOnly cookie)
        userId:
          $ref: '#/components/schemas/UserId'
        activeTenantId:
          $ref: '#/components/schemas/BigintId'
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresInSeconds
      - userId
      - activeTenantId
    AuthActionCreate:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - email_verification
          - password_reset
        email:
          type: string
          format: email
      additionalProperties: false
      required:
      - purpose
    AuthActionRedeem:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - email_verification
          - password_reset
        token:
          type: string
        newPassword:
          type: string
      additionalProperties: false
      required:
      - purpose
      - token
    IdentityLink:
      type: object
      properties:
        provider:
          type: string
        idToken:
          type: string
      additionalProperties: false
      required:
      - provider
      - idToken
    User:
