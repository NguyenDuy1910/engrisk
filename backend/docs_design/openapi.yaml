        newPassword: {type: string, writeOnly: true, minLength: 8, maxLength: 128}
    PasswordSessionCreate:
      type: object
      additionalProperties: false
      required: [method, email, password]
      properties:
        method: {type: string, const: password}
        email: {type: string, format: email}
        password: {type: string, writeOnly: true, minLength: 1, maxLength: 128}
