          - type: single_choice
            examType: toeic_lr
            groupPosition: 1
            prompt:
              stem: Where most likely are the speakers?
              options:
                - key: A
                  text: At a train station
                - key: B
                  text: In an office building
                - key: C
                  text: At a hotel
                - key: D
                  text: In a restaurant
              optionSet: abcd
            answerKey:
              choice: B
            explanation:
              texts:
                vi: Người nam hỏi “đúng tầng họp ngân sách không” và người nữ nhắc tới phòng 405 → họ đang ở tòa văn phòng.
                en: The man asks about the floor of a budget meeting and the woman mentions Room 405, so they are in an office building.
              evidence:
                stimulusPart: 0
                quote: Excuse me, is this the right floor for the budget meeting?
            skills:
              - code: listening.inference
                isPrimary: true
            difficulty: 3
            defaultPoints: 1
          - type: single_choice
            examType: toeic_lr
            groupPosition: 2
            prompt:
              stem: Why has the meeting been moved?
              options:
                - key: A
                  text: A room is being cleaned
                - key: B
                  text: A projector is not working
                - key: C
                  text: More people will attend
                - key: D
                  text: The manager is late
              optionSet: abcd
            answerKey:
              choice: B
            explanation:
              texts:
                vi: Người nữ nói “projector here is broken” → máy chiếu hỏng.
                en: The woman says the projector is broken.
              evidence:
                stimulusPart: 0
                quote: because the projector here is broken
            skills:
              - code: listening.detail
                isPrimary: true
            difficulty: 3
            defaultPoints: 1
          - type: single_choice
            examType: toeic_lr
            groupPosition: 3
            prompt:
              stem: What will the man most likely do next?
              options:
                - key: A
                  text: Contact his manager
                - key: B
                  text: Repair the projector
                - key: C
                  text: Book another room
                - key: D
                  text: Print some figures
              optionSet: abcd
            answerKey:
              choice: A
            explanation:
              texts:
                vi: Người nam nói “I should let my manager know” → anh ấy sẽ liên lạc với quản lý.
                en: He says he should let his manager know.
              evidence:
                stimulusPart: 0
                quote: I should let my manager know
