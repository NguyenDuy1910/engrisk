      tags: [Auth]
      summary: Request an email verification or password reset email
      description: |
        Sends a single-use token by email. `email_verification` targets the caller's own
        unverified email (session required; `email` ignored); `password_reset` takes `email` and
        works without a session. Always answers `202` whether or not an account exists (no account
        enumeration). Rate limited per email and IP. Phase P1.
