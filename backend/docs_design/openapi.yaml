      x-permissions: [public, session]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationTokenRequest'
            examples:
              reset:
                summary: Forgotten password
                value: {purpose: password_reset, email: minh.nguyen@gmail.com}
              verify:
                summary: Resend verification email
                value: {purpose: email_verification}
      responses:
        '202':
          description: Accepted; an email is sent if applicable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '422':
