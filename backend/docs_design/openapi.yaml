      required:
        - kind
        - blocks
      properties:
        title:
          type: string
        kind:
          type: string
          enum:
            - email
            - article
            - notice
            - chart_caption
            - other
          x-extensible-enum: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PassageBlock'
          minItems: 1
      additionalProperties: false
