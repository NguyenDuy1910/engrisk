        questions:
          type: array
          items:
            type: string
        prepSeconds:
          type: integer
          minimum: 0
        answerSeconds:
          type: integer
          minimum: 1
    SpeakingQuestionAuthoring:
      allOf:
        - $ref: '#/components/schemas/QuestionAuthoringBase'
        - type: object
          required:
            - type
            - prompt
            - rubricKey
          properties:
            type:
              type: string
              const: speaking
            prompt:
              $ref: '#/components/schemas/SpeakingPrompt'
            rubricKey:
              type: string
              pattern: ^[a-z0-9_]+_v[0-9]+$
              description: Versioned rubric id, e.g. `ielts_writing_task2_v1`, `ielts_speaking_v1`.
            explanation:
              oneOf:
                - $ref: '#/components/schemas/Explanation'
                - type: 'null'
      description: Authoring representation of a `speaking` question (protected fields included).
    SpeakingQuestionCreate:
      type: object
      required:
        - type
        - prompt
        - rubricKey
      properties:
        type:
          type: string
          const: speaking
        examType:
          $ref: '#/components/schemas/ExamTypeCode'
        groupId:
          $ref: '#/components/schemas/Uuid'
          description: Attach to an existing draft group (ignored inside `QuestionGroupCreate.questions`).
        groupPosition:
          type: integer
          minimum: 1
        prompt:
          $ref: '#/components/schemas/SpeakingPrompt'
        rubricKey:
          type: string
          pattern: ^[a-z0-9_]+_v[0-9]+$
          description: Versioned rubric id, e.g. `ielts_writing_task2_v1`, `ielts_speaking_v1`.
        explanation:
          $ref: '#/components/schemas/ExplanationInput'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillTag'
          maxItems: 5
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        defaultPoints:
          type: number
          minimum: 0
          default: 1
        visibility:
          $ref: '#/components/schemas/ContentVisibility'
          description: 'Defaults: staff → `tenant`; contributor/learner → `private` (owner = caller).'
        sourceMaterialId:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
      description: Create a draft `speaking` question. `rubricKey` is required instead of an answer key.
    SpeakingQuestionDelivery:
      type: object
      description: 'Delivery representation of a `speaking` question: prompt only. Has NO answerKey/explanation/outcome/reviewFlags properties (see disclosure policy in api_contract.md).'
      required:
        - position
        - numberLabel
        - sectionKey
        - partKey
        - groupId
        - questionId
        - type
        - points
        - prompt
        - presentation
      properties:
        position:
          type: integer
          minimum: 1
          description: Natural key of the response inside the attempt/revision.
        numberLabel:
          type: string
          description: Printed number ("32", "Q14").
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        partKey:
          $ref: '#/components/schemas/PartKey'
        groupId:
          type:
            - string
            - 'null'
          format: uuid
        questionId:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          const: speaking
        points:
          type: number
          minimum: 0
        prompt:
          $ref: '#/components/schemas/SpeakingPrompt'
        presentation:
          $ref: '#/components/schemas/QuestionPresentation'
      additionalProperties: false
    SpeakingQuestionReview:
      type: object
      description: 'Review representation of a `speaking` question: prompt + rubric labels + explanation + learner outcome (`outcome` null in revision preview).'
      required:
        - position
        - numberLabel
        - sectionKey
        - partKey
        - groupId
        - questionId
        - type
        - points
        - prompt
        - presentation
        - rubric
        - explanation
        - outcome
      properties:
        position:
          type: integer
          minimum: 1
          description: Natural key of the response inside the attempt/revision.
        numberLabel:
          type: string
          description: Printed number ("32", "Q14").
        sectionKey:
          $ref: '#/components/schemas/SectionKey'
        partKey:
          $ref: '#/components/schemas/PartKey'
        groupId:
          type:
            - string
            - 'null'
          format: uuid
        questionId:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          const: speaking
        points:
          type: number
          minimum: 0
        prompt:
          $ref: '#/components/schemas/SpeakingPrompt'
        presentation:
          $ref: '#/components/schemas/QuestionPresentation'
        rubric:
          type: object
          description: Rubric name and criteria labels only — never the rubric key content (see disclosure policy in api_contract.md).
          required:
            - rubricKey
            - criteria
          properties:
            rubricKey:
              type: string
            criteria:
              type: array
              items:
                type: object
                required:
                  - key
                  - label
                properties:
                  key:
                    type: string
                  label:
                    type: string
        explanation:
          anyOf:
            - $ref: '#/components/schemas/Explanation'
            - type: 'null'
        outcome:
          anyOf:
            - $ref: '#/components/schemas/ResponseOutcome'
            - type: 'null'
