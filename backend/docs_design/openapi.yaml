openapi: 3.1.0
info:
  title: Engrisk REST API — Clean Resource Contract
  version: 2.0.0-design
  summary: Schema-aligned, resource-oriented API for TOEIC/IELTS and future learning content
  description: 'Design artifact for FastAPI, PostgreSQL, React and React Native. Matches Engrisk DBML V4.2 mixed
    IDs. Resource contracts do not mirror database tables. No implementation or migration is included.


    Content is versioned and composed through relations. Published assessment graphs and attempts are immutable
    snapshots. Server enforces authorization on every resource, tenancy, placement, media access and state transition.


    Naming: plural kebab-case URLs; camelCase JSON and query names; snake_case enum values. All IDs JSON strings,
    including BIGINT. userId is an 8-digit string; tenantId and other BIGINTs are decimal strings; contentItemId/contentVersionId/mediaAssetId/jobId
    are UUID strings. Database keys are not automatically exposed as an API hierarchy.


    GET safe, POST creates or triggers a documented domain transition, PUT replaces a known subresource, PATCH partially
    modifies allowed fields, DELETE removes or revokes only when semantics permit. Mutation requests use explicit
    DTOs, never arbitrary ORM objects. No mutation of published version contents or responses after submit.


    No envelope for individual resources; collections use {items,nextCursor}. No success:true wrapper. Errors use
    RFC 9457 application/problem+json. ETag/If-Match for authoring edits; Idempotency-Key for non-repeatable creates
    and transitions; attempt response sync uses per-row expected revision for optimistic concurrency. Rate limiting
    is applied to login, AI, uploads, and public write endpoints.


    Only the active tenant in the trusted session determines tenant scope. Unknown/invisible resources return 404;
    visible-but-forbidden operations return 403. Protected answer specs and media transcripts never appear in catalog/delivery
    DTOs.


    x-phase P1-P4 indicates roadmap, not a separate URL namespace.'
servers:
- url: http://localhost:8000/api/v1
  description: Local FastAPI + MinIO
- url: https://api.engrisk.app/api/v1
  description: Illustrative production URL; configure before deployment
tags:
- name: Auth
  description: User identity, sessions, verification and recovery
- name: Me
  description: Authenticated user profile, linked identities and memberships
- name: Tenants
  description: Active-tenant administrative operations
- name: Reference
  description: Cacheable examination and content contract registries
- name: Catalog
  description: Published, accessible learner-facing content
- name: Content
  description: One reusable authoring surface for all structural content kinds
- name: Media
  description: Storage-provider-neutral upload, download grants and metadata
- name: Imports
  description: Import package validation and commit into content drafts
- name: Materials
  description: Private source documents for content generation
- name: Workflow
  description: Contributions, reviews, comments, reporting and licensing
- name: Attempts
  description: One execution engine for exams, drills, quizzes and adaptive sessions
- name: Progress
  description: Goals and learner progress read model
- name: Evaluations
  description: Immutable feedback history for response-level human/AI grading
- name: Conversations
  description: Generic tutoring/learning conversations
- name: Generation
  description: Content generation from AI or provided learning material
- name: Jobs
  description: Read/manage server-created asynchronous operations
security:
- bearerAuth: []
paths:
  /auth/sessions:
    post:
      tags:
      - Auth
      operationId: postAuthSessions
      summary: Create guest, password or Google session
      x-phase: P1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      description: 'Guest: create user and platform membership; password/google authenticate. Web refresh token
        via HttpOnly cookie, mobile via body. Apply rate limits and secure token rotation.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
        description: Required for guest session creation; scope to caller/session-init context and never persist
          raw tokens in replay store.
  /auth/sessions/refresh:
    post:
      tags:
      - Auth
      operationId: postAuthSessionsRefresh
      summary: Rotate refresh token and optionally switch active tenant
      x-phase: P1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      description: Web cookie requires trusted Origin + CSRF defense; mobile sends refreshToken in request body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefresh'
  /auth/sessions/current:
    delete:
      tags:
      - Auth
      operationId: deleteAuthSessionsCurrent
      summary: Sign out current session
      x-phase: P1
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      x-permissions:
      - session
  /auth/actions:
    post:
      tags:
      - Auth
      operationId: postAuthActions
      summary: Request email verification or password reset
      x-phase: P1
      responses:
        '202':
          description: Accepted for asynchronous processing
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      description: Return 202 for existing and unknown email; prevent account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthActionCreate'
  /auth/actions/redeem:
    post:
      tags:
      - Auth
      operationId: postAuthActionsRedeem
      summary: Consume single-use account action token
      x-phase: P1
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthActionRedeem'
