      additionalProperties: false
      description: 'JSON Merge Patch (RFC 7396) of exam metadata. Metadata is not revisioned; `examType`, `kind` and `provenance` are immutable here. Contributors cannot set `visibility`/`accessTier` (403 `permission.denied`); `visibility: public` is platform-tenant only.'
