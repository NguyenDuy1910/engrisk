        recordingAssetId:
          $ref: '#/components/schemas/Uuid'
          description: MediaAsset with purpose `learner_response`, context = this attempt/position, status `processing|available`.
        durationMs:
          type: integer
          minimum: 1
          maximum: 300000
      additionalProperties: false
    SpeakingPrompt:
      type: object
      description: Learner-visible prompt for `speaking` (IELTS Speaking, P2). `cueCard` only for Part 2.
      required:
        - speakingPart
        - questions
        - prepSeconds
        - answerSeconds
      properties:
        speakingPart:
          type: integer
