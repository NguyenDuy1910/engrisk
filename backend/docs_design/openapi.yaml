# Engrisk API — OpenAPI 3.1 contract (design draft, not implemented).
# Companion docs: api_architecture.md · api_contract.md · api_data_mapping.md ·
# storage_architecture.md · api_design_review.md (same folder).
# Extensions: x-phase (P1–P4 roadmap), x-permissions (permission keys / session / owner / public),
# x-extensible-enum (clients must tolerate unknown values), x-event-schema (SSE payload).
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Engrisk API
  version: 1.0.0-draft
  summary: Public HTTP API of the Engrisk AI English learning platform (TOEIC / IELTS).
  description: |
    One public API consumed identically by the React web app and the React Native app
    (OpenAPI-generated TypeScript clients). Served by a FastAPI modular monolith
    (identity, tenancy, catalog, authoring, learning, media, ai, platform) on PostgreSQL,
    with direct-to-storage uploads (Cloudflare R2 in production, MinIO locally).

    ## Conventions
    - **Base path** `/api/v1` (major version in the URI). Paths are plural, kebab-case nouns;
      lifecycle commands use `POST /{resource}/{id}/{verb}` with a fixed verb vocabulary
      (`submit`, `resubmit`, `withdraw`, `abandon`, `publish`, `complete`, `commit`, `cancel`,
      `redeem`, `refresh`, `decision`). JSON fields and query parameters are camelCase; enum
      values are snake_case. Clients MUST tolerate unknown enum values where
      `x-extensible-enum: true` is set.
    - **IDs** are opaque UUIDs. Natural keys only where stable: `examTypeCode`, `sectionKey`,
      `skillCode`, identity `provider`, response `position`.
    - **Time**: RFC 3339 UTC with `Z`, fields suffixed `At`; dates suffixed `Date`; durations carry
      their unit (`durationMs`, `timeLimitSeconds`).
    - **Authentication**: short-lived JWT access token (15 min) in `Authorization: Bearer`
      (claims `sub`, `sid`, `tid`, `knd`, `ver`). Rotating opaque refresh token: HttpOnly cookie
      `engrisk_rt` scoped to `/api/v1/auth` on web (cookie refresh requires
      `X-Requested-With: engrisk` + Origin check), response body on mobile. Every client without a
      session first creates a **guest session**; sign-up adds an identity to the same user.
    - **Tenant context** is the token claim `tid` only (no tenant header). Switching tenant =
      `POST /auth/sessions/refresh {activeTenantId}`. Foreign-tenant or non-owned ids return
      `404 resource.not_found` (no existence oracle); `403` only when the caller can see the
      resource but lacks the permission/state.
    - **Errors**: RFC 9457 Problem Details (`application/problem+json`) with `code`
      (domain-prefixed snake_case, e.g. `attempt.deadline_passed`), `traceId` (= `X-Request-Id`)
      and `errors[]` (JSON Pointer) for validation. `type` = `https://docs.engrisk.app/problems/{code}`.
    - **Pagination**: collections return `{items, nextCursor}`; `?cursor=&limit=` (default 20,
      max 100). No total counts unless `facets` is documented. Sorting via `?sort=field|-field`
      from a per-endpoint allow-list. Content endpoints are bounded and unpaginated.
    - **Idempotency**: `Idempotency-Key` (client UUID) is required on the documented POSTs and
      optional on other POSTs; stored 24 h per (user, key, method, path). Replays return the
      original status + body with `Idempotent-Replayed: true`; same key with a different body →
      `422 idempotency_key_reused`; concurrent duplicate → `409 request_in_progress`.
    - **Concurrency**: editable resources return a strong `ETag`; mutations of authoring
      resources, `/me` and goals require `If-Match` (`412 precondition_failed` on mismatch,
      `428 precondition_required` when missing). Create-if-absent uses `If-None-Match: *`.
      Attempt sync uses per-change sequence numbers instead.
    - **Partial updates**: `application/merge-patch+json` (RFC 7396), except the attempt
      change-set (`PATCH /attempts/{attemptId}`, `application/json`).
    - **Views**: `view=` selects a representation of the same resource, each with its own
      schema and authorization (`catalog|authoring` on exams, `delivery|review|authoring` on
      content). A view never bypasses protection.
    - **Disclosure rule**: protected fields (answer keys, explanations, evidence, transcripts,
      script segments, fine cues, review flags, auto-check details, provider metadata, storage
      keys) exist only in schemas named `*Review`, `*Authoring`, `*Feedback` or `*Staff`.
      `*Delivery` schemas do not declare them at all.
    - **Caching**: reference data `Cache-Control: public, max-age=3600` + `ETag`; published
      catalog `private, max-age=300` + `ETag`; protected/review views are never cached by
      shared caches.
    - **Rate limits**: `429` + `Retry-After` + `RateLimit`/`RateLimit-Policy` on auth, AI and upload
      endpoints. **Locale**: `Accept-Language: vi|en` (default `vi`). **Client version**:
      `X-Client-Version` (`ios/1.2.0`); unsupported builds get `426 client_upgrade_required`.
      **Deprecation**: `Deprecation` + `Sunset` headers and `deprecated: true` (≥ 6 months for mobile).

    ## Extensions
    - `x-phase`: delivery phase of the operation — `P1` MVP, `P2` IELTS Writing/Speaking AI,
      `P3` Content Studio full / community / library, `P4` B2B tenants.
    - `x-permissions`: permission keys checked server-side (never role names), or the
      pseudo-keys `public` (no token), `session` (any token incl. guest), `registered`
      (non-guest), `owner` (resource owner policy). `GET /me` exposes effective permissions for UI
      gating only.
    - `x-extensible-enum`: clients must accept unknown values.
  contact:
    name: Engrisk Platform Team
    url: https://docs.engrisk.app
  license:
    name: Proprietary
    identifier: LicenseRef-Engrisk-Proprietary
servers:
  - url: https://api.engrisk.app/api/v1
    description: Production (Cloudflare R2 object storage)
  - url: http://localhost:8000/api/v1
    description: Local development (MinIO object storage)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sessions (guest, password, Google), token refresh / tenant switch, sign-out, email verification and password reset.
  - name: Me
    description: Current user bootstrap (permissions, entitlements, memberships, branding), profile, linked identities (guest conversion), account deletion and exam ratings.
  - name: Tenants
    description: P4 B2B tenancy — invitations, current-tenant administration, members, branding.
  - name: Reference
    description: One versioned, cacheable bundle of exam types, structure templates, skills, question types, voices and sound check.
  - name: Exams
    description: Exam catalog and exam metadata (`view=catalog` for learners, `view=authoring` for Studio lists and details).
  - name: Authoring
    description: Exam write side — creation, metadata, credits, revisions, revision items, audio tracks, validation and publish.
  - name: QuestionBank
    description: Questions and question groups (stimulus + questions) with copy-on-write versioning.
  - name: ContentImports
    description: P3 package imports (manifest + media ZIP) with validation report and commit to a draft exam.
  - name: Submissions
    description: P3 community/tenant content submissions, review decisions and anchored review comments.
  - name: ContentReports
    description: P3 learner reports about content errors, copyright or inappropriate material, triaged in Studio.
  - name: Licensing
    description: P4 platform-granted exam licenses to organization tenants.
  - name: Media
    description: Direct-to-storage uploads (single or multipart), completion, provider-neutral access URLs.
  - name: Library
    description: P3 learner source materials used for AI question generation.
  - name: Attempts
    description: Attempt lifecycle — start, content delivery, change-set sync, submit, results, evaluations.
  - name: Progress
    description: Learner progress read model (Home/Progress screens) and goals.
  - name: Jobs
    description: Public async operations (AI, media, import, account deletion) with polling and SSE events.
  - name: Tutor
    description: AI tutor conversations grounded in disclosed responses or questions.

paths:
  /attempts:
    post:
      operationId: startAttempt
      tags:
        - Attempts
      summary: Start an attempt
      description: 'Pins `exams.current_revision_id`, creates one response per served question (subset via `settings.parts` or `source` redo filter), computes server timing (mock: section windows; practice: optional limit). Mode matrix by exam kind: `full_mock` and `section_test` → `mock` or `practice` (practice serves the selected parts); `practice_set` and `personal_practice` → `practice` only. At most one `in_progress` attempt per (exam, mode). Idempotency-Key required. Errors: `resource.not_found` 404 (unknown/invisible exam), `exam.access_denied` 403 (meta `requiredTier`, `reason: account_required|entitlement_required|coming_soon`), `attempt.mode_not_allowed` 422, `attempt.in_progress_exists` 409 (meta `attemptId`).'
      x-phase: P1
      x-permissions:
        - session
        - exam.take
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
            examples:
              practiceP3:
                $ref: '#/components/examples/StartPracticeP3'
              mock:
                $ref: '#/components/examples/StartMock'
      responses:
        '201':
          description: Attempt started.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listAttempts
      tags:
        - Attempts
      summary: List own attempts
      description: 'Own attempts in the active tenant. Sort allow-list: `-startedAt` (default).'
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status (e.g. `in_progress` for resume).
          schema:
            $ref: '#/components/schemas/AttemptStatus'
        - name: examId
          in: query
          required: false
          description: Filter by exam.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/ExamTypeQuery'
        - name: mode
          in: query
          required: false
          description: Filter by mode.
          schema:
            $ref: '#/components/schemas/AttemptMode'
        - name: since
          in: query
          required: false
          description: startedAt ≥ since.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptIdPath'
    get:
      operationId: getAttempt
      tags:
        - Attempts
      summary: Get attempt state
      description: 'Resume/bootstrap: status, settings, server timing (`serverNow`, section windows), resumeState, counts; `include=responses` (default) and/or `annotations`. Foreign attempts → 404.'
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - name: include
          in: query
          required: false
          description: 'Comma list: `responses`, `annotations`.'
          schema:
            type: string
            pattern: ^(responses|annotations)(,(responses|annotations))*$
            default: responses
      responses:
        '200':
          description: Attempt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: syncAttempt
      tags:
        - Attempts
      summary: Sync attempt changes (autosave change-set)
      description: 'Typed change-set (`application/json`, not merge-patch) for answers, flags, eliminations, time deltas, annotations, resume state, display and practice clock. Per change: applied iff `deviceId` differs from the stored device for that target (cross-device last-write-wins by arrival) or `seq` > stored seq, else `ignored_stale`; `timeSpentMsDelta` counted only when applied. Partial success: each change gets a `ChangeAck` (`applied|ignored_stale|rejected` + `code`: `attempt.section_closed`, `response.locked`, `response.invalid_answer`, `attempt.pause_not_allowed`). `check:true` (practice with instantCheck) grades and locks the position and returns `feedback[]`; mock never returns correctness. Retries are safe without Idempotency-Key. Whole-request errors: `attempt.not_in_progress` 409 (meta `status`, `resultUrl`), `attempt.deadline_passed` 409.'
      x-phase: P1
      x-permissions:
        - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptChangeSet'
            examples:
              autosave:
                $ref: '#/components/examples/ChangeSetRequest'
              practiceCheck:
                $ref: '#/components/examples/PracticeCheckRequest'
      responses:
        '200':
          description: Per-change acknowledgements.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptSyncResult'
              examples:
                staleAck:
                  $ref: '#/components/examples/SyncResultWithStale'
                checkFeedback:
                  $ref: '#/components/examples/PracticeCheckResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /attempts/{attemptId}/abandon:
    parameters:
      - $ref: '#/components/parameters/AttemptIdPath'
    post:
      operationId: abandonAttempt
      tags:
        - Attempts
      summary: Abandon a practice attempt
      description: In-progress practice only; mock → `422 attempt.mock_cannot_abandon` (submit instead). Not in progress → `409 attempt.not_in_progress`.
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Abandoned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /attempts/{attemptId}/content:
    parameters:
      - $ref: '#/components/parameters/AttemptIdPath'
    get:
      operationId: getAttemptContent
      tags:
        - Attempts
      summary: Get attempt content (delivery or review)
      description: 'The only learner path to exam content: projection of the pinned revision, served subset only. `view=delivery` (default) → `ContentDelivery` (no keys, explanations, transcripts, cues or review flags at any depth). `view=review` → `ContentReview` after submit, or in practice for checked positions only (others omitted) — otherwise `403 attempt.review_not_available`. `section` is required for multi-section mocks; future (locked) sections → `403 attempt.section_locked`. `Cache-Control: private, max-age` ≤ embedded URL TTL.'
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - name: view
          in: query
          required: false
          description: Representation.
          schema:
            type: string
            enum:
              - delivery
              - review
        - name: section
          in: query
          required: false
          description: Section to load (required for multi-section mock).
          schema:
            $ref: '#/components/schemas/SectionKey'
      responses:
        '200':
          description: Content.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptContentResponse'
              examples:
                toeicPart3Practice:
                  $ref: '#/components/examples/Toeic3PracticeContent'
                toeicMockListening:
                  $ref: '#/components/examples/ToeicMockListeningContent'
                ieltsReading:
                  $ref: '#/components/examples/IeltsReadingContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /attempts/{attemptId}/evaluations:
    parameters:
      - $ref: '#/components/parameters/AttemptIdPath'
    post:
      operationId: requestEvaluation
      tags:
        - Attempts
      summary: Request an evaluation
      description: '`evaluator: ai` (owner): re-run when the latest AI evaluation failed; quota applies (`ai.quota_exceeded` 429, `ai.feature_disabled` 403) → 202 pending with `jobId`. `evaluator: human` (P4, `evaluation.review` in same tenant): records a teacher evaluation → 201 completed, supersedes AI. Idempotency-Key required. Failed evaluations are kept as history (status `failed`); an AI re-run creates a new evaluation row.'
      x-phase: P2
      x-permissions:
        - owner
        - evaluation.review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
            examples:
              aiRetry:
                $ref: '#/components/examples/AiEvalRetry'
      responses:
        '201':
          description: Human evaluation recorded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '202':
          description: AI evaluation queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /attempts/{attemptId}/result:
    parameters:
      - $ref: '#/components/parameters/AttemptIdPath'
    get:
      operationId: getAttemptResult
      tags:
        - Attempts
      summary: Get attempt result
      description: 'Submitted/completed own attempts: scores (always estimate kinds), breakdown, graded responses, evaluations (pending ones carry `jobId`), next step. In progress → `409 attempt.not_in_progress`.'
      x-phase: P1
      x-permissions:
        - owner
      responses:
        '200':
          description: Result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
              examples:
                ieltsWriting:
                  $ref: '#/components/examples/WritingResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /attempts/{attemptId}/submit:
    parameters:
      - $ref: '#/components/parameters/AttemptIdPath'
    post:
      operationId: submitAttempt
      tags:
        - Attempts
      summary: Submit an attempt (or close one section)
      description: 'Applies `finalChanges` (same rules as sync), then submits: objective grading synchronous; essay/speaking evaluations queued as jobs. With `sectionKey`: closes that section early (mock multi-section). Idempotent by state and Idempotency-Key: an already submitted attempt returns 200 with the same body (`Idempotent-Replayed: true` on key replay). Idempotency-Key required.'
      x-phase: P1
      x-permissions:
        - owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptSubmit'
            examples:
              final:
                $ref: '#/components/examples/SubmitWithFinal'
      responses:
        '200':
          description: Submitted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptSubmitResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/sessions:
    post:
      operationId: createSession
      tags: [Auth]
      summary: Sign in or start a guest session
      description: |
        Creates an authenticated session. `method` selects the flow:
        `guest` creates a real guest user (every client without a session calls this first;
        `Idempotency-Key` REQUIRED for guest so retries never create duplicate guests; because no
        user exists yet the key is scoped to (key, method, path) without a user, and a replay
        returns the same guest user with freshly issued tokens, never the stored ones);
        `password` signs in with email + password; `google` verifies a Google ID token and
        JIT-creates a registered user when unknown. If a Google email matches an existing
        password account, the call fails with `409 auth.identity_conflict` (sign in with password,
        then link Google via `POST /me/identities`).
        Web receives the refresh token as the `engrisk_rt` HttpOnly cookie; mobile receives it in
        the body. Rate limited per IP and per email. Phase P1.
      x-phase: P1
      x-permissions: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            examples:
              guest:
                summary: First app launch (guest)
                value: {method: guest, locale: vi, timezone: Asia/Ho_Chi_Minh}
              password:
                summary: Minh signs in with email
                value: {method: password, email: minh.nguyen@gmail.com, password: 'correct-horse-42'}
              google:
                summary: Google sign-in
                value: {method: google, idToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjFmNDAifQ.eyJzdWIiOiIxMDk4In0.c2ln}
      responses:
        '201':
          description: Session created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Set-Cookie:
              description: 'Web only: `engrisk_rt=<opaque>; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict`.'
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
              examples:
                guest:
                  $ref: '#/components/examples/SessionTokensGuest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [Auth]
      summary: Sign out (revoke the current session)
      description: |
        Revokes the session identified by the access token `sid` claim and clears the refresh
        cookie. Other sessions of the user stay active. Idempotent. Phase P1.
      x-phase: P1
      x-permissions: [session]
      responses:
        '204':
          description: Session revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: Expired `engrisk_rt` cookie (web).
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Rotate the refresh token and optionally switch tenant
      description: |
        Rotates the refresh token (cookie on web, `refreshToken` in body on mobile) and mints a
        new access token. Reuse of an already-rotated refresh token revokes the whole session
        (`401 auth.refresh_invalid`). Optional `activeTenantId` switches the tenant context after a
        membership check (`403 tenant.membership_required`); this is the only tenant-switch
