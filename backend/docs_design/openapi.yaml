    post:
      operationId: redeemVerificationToken
      tags: [Auth]
      summary: Redeem an email verification or password reset token
      description: |
        Consumes a token from the email link. `email_verification` marks the email verified;
        `password_reset` sets a new password and **revokes all sessions** of the user.
        Errors: `400 auth.token_invalid`, `410 auth.verification_expired`, `422 validation.failed`
