  overlayClose:(d,el,ev)=>{ if(ev.target===el){ S.modal=null; S.sheet=null; render(); } },
  ff:()=>{ if(S.exam&&S.exam.mode==='mock'){ S.exam.remaining=15; render(); } },
  resultFilter:d=>{S.resultFilter=d.v;render();},
  openReview:d=>{ S.review.idx=+d.i; S.review.onlyWrong=!S.result.items[+d.i].ok?S.review.onlyWrong:false; go('review'); },
  reviewGo:d=>{ if(d.i==='') return; S.review.idx=+d.i; render(true); },
  reviewWrong:()=>{ S.review.onlyWrong=!S.review.onlyWrong; render(); },
  openHistory:d=>{ if(d.status!=='completed'){ S.introExam=d.exam; go('exam-intro'); return; }
    const ex=EXAMS[d.exam]; S.result=buildResult(d.exam,ex.qids,CANNED[d.exam]||{},{},ex.mode); S.resultFilter='all'; go('results'); },
  askTutor:d=>{ S.tutor={ctx:d.q,myAnswer:d.a,messages:null,typing:false,draft:'',opened:true}; S.states.tutor=null; go('tutor'); },
  tutorAsk:d=>tutorSend(d.t),
  tutorSend:()=>{ const t=S.tutor.draft.trim(); if(t) tutorSend(t); },
  rate:()=>toast('Cảm ơn phản hồi','Đánh giá giúp cải thiện chất lượng giải thích (tutor_messages.learner_rating).','info'),
  upload:()=>{ const L=S.lib, id='n'+Date.now(); L.materials.unshift({id,title:'My notes - Unit 5.pdf',meta:'PDF · 3 trang · 420 KB',rights:{own_work:'Tự sở hữu',licensed:'Có giấy phép',public_domain:'Công cộng',personal_study_only:'Chỉ học cá nhân'}[L.rights],status:'uploaded'}); L.rightsOk=false; L.rights=''; S.states.library=null; render();
    setTimeout(()=>{ const m=L.materials.find(x=>x.id===id); if(m){m.status='processing';m.p=35;render();} },900);
    setTimeout(()=>{ const m=L.materials.find(x=>x.id===id); if(m){m.p=80;render();} },1900);
    setTimeout(()=>{ const m=L.materials.find(x=>x.id===id); if(m){m.status='ready';render(); toast('Tài liệu sẵn sàng','Bạn có thể tạo câu hỏi từ tài liệu này.');} },2900); },
  removeMat:d=>{ S.lib.materials=S.lib.materials.filter(m=>m.id!==d.id); render(); },
  generate:d=>{ S.lib.gen='generating'; S.lib.genFrom=d.id; render(); setTimeout(()=>{ S.lib.gen='ready'; S.lib.drafts=['gq1','gq2','gq3','gq4'].map(qid=>({qid,status:'draft'})); render(); },1600); },
  draftStatus:d=>{ S.lib.drafts[+d.i].status=d.s; S.lib.editing=null; render(); },
  editDraft:d=>{ S.lib.editing=+d.i; render(); const el=document.getElementById('edit-'+d.i); if(el) el.focus(); },
  saveDraft:d=>{ const el=document.getElementById('edit-'+d.i); if(el&&el.value.trim()) Q[S.lib.drafts[+d.i].qid].stem=el.value.trim(); S.lib.editing=null; render(); toast('Đã lưu chỉnh sửa','Câu hỏi vẫn ở trạng thái nháp đến khi bạn duyệt.','info'); },
  createPersonal:()=>{ const qids=S.lib.drafts.filter(x=>x.status==='approved').map(x=>x.qid); EXAMS['personal-remote']={track:'personal',title:'Bộ luyện riêng: Remote work trends',kind:'personal_practice',skill:'reading',count:qids.length,minutes:qids.length*2,diff:3,tier:'registered',mode:'practice',qids,desc:'Tạo từ tài liệu của bạn.'}; S.lib.personal='personal-remote'; render(); toast('Đã tạo bộ luyện riêng tư','Chỉ bạn thấy bộ này. Có trong Luyện tập.'); },
  libReset:()=>{ S.lib=initial().lib; if(S.persona!=='returning') S.lib.materials=[]; render(); },
  wMode:d=>{ if(d.v==='web'){ toast('Đã gửi link tiếp tục trên web','Bài làm tự lưu và đồng bộ giữa thiết bị (mô phỏng).','info'); return; } S.writing.mobileMode=d.v; render(); },
  wSample:()=>{ S.writing.text=W_SAMPLE; render(); },
  writingSubmit:()=>{ S.modal={type:'writingSubmit'}; render(); },
  writingConfirm:()=>{ S.modal=null; S.writing.phase='evaluating'; render(); setTimeout(()=>{ if(S.writing&&S.writing.phase==='evaluating'){ S.writing.phase='feedback'; render(); } },1800); },
  writingRetry:()=>{ S.states.writing=null; S.writing.phase='evaluating'; render(); setTimeout(()=>{ if(S.writing){S.writing.phase='feedback'; render();} },1500); },
  writingReset:()=>{ S.writing=null; S.states.writing=null; render(); },
  spk:d=>{ const P=S.speaking; P.phase=d.p; if(d.p==='prep'||d.p==='recording'){P.t=0;} if(d.p==='evaluating') setTimeout(()=>{ if(S.speaking&&S.speaking.phase==='evaluating'){S.speaking.phase='feedback';render();} },1800); render(); },
  spkReset:()=>{ S.speaking=null; render(); },
  notif:()=>{S.notif=!S.notif;render();},
  linkGoogle:()=>{S.googleLinked=true;render();toast('Đã liên kết Google','Bạn có thể đăng nhập bằng Google hoặc email.');},
  logout:()=>{ personaApply('guest'); go('landing'); toast('Đã đăng xuất','','info'); },
  deleteAccount:()=>{ S.modal={type:'delete'}; render(); },
  confirmDelete:()=>{ personaApply('guest'); go('landing'); toast('Đã gửi yêu cầu xóa tài khoản','Mô phỏng — không có dữ liệu thật bị xóa.','info'); },
  switchTenant:d=>{ S.tenant=d.v; render(); toast(d.v==='sunrise'?'Đã chuyển sang Sunrise English':'Đã chuyển về Engrisk','Phiên đăng nhập đổi active_tenant_id; dữ liệu học tách riêng.','info'); },
  invite:d=>{ S.org.invite=d.v; if(d.v==='accepted'){ S.tenant='sunrise'; toast('Đã tham gia Sunrise English','Tạo membership + vai trò Học viên.'); } if(d.v!=='accepted'&&S.tenant==='sunrise') S.tenant='engrisk'; render(); },
  orgAccent:d=>{ S.org.accent=d.c; if(S.tenant!=='sunrise') S.tenant='sunrise'; render(); },
};
function finishAuth(method){
  const convert=S.auth.convert, signup=S.auth.tab==='signup'||convert;
  if (method==='password'){
    const email=(document.getElementById('f-email')||{}).value||'';
    if ((!signup && email.trim().toLowerCase()==='sai@example.com') || !email.includes('@')){ S.states.auth='error'; render(); return; }
  }
  S.states.auth='loading'; render();
  setTimeout(()=>{
    S.states.auth=null;
    const keepResult=S.result, extra=S.extraHistory.slice(), keepResume=S.resume;
    if (signup){ personaApply('new'); S.extraHistory=convert?extra:[]; S.result=convert?keepResult:null; S.resume=convert?keepResume:null; S.auth.convert=false;
      toast(convert?'Đã lưu kết quả vào tài khoản mới':'Đã tạo tài khoản', method==='google'?'Đăng nhập bằng Google (mô phỏng).':'Kiểm tra email để xác minh (mô phỏng).');
      S.onb={step:0,exam:null,level:null,target:null,minutes:null}; go('onboarding'); }
    else { personaApply('returning'); go('home'); toast('Chào mừng trở lại', method==='google'?'Đăng nhập bằng Google (mô phỏng).':''); }
  },900);
}
function tutorSend(text){
  const T=S.tutor, q=Q[T.ctx]; if (T.typing) return;
  T.messages.push({from:'me',text}); T.draft=''; T.typing=true; render();
  setTimeout(()=>{ T.typing=false; const f=TUTOR_REPLIES[text]; const r=f?f(q):'(Mô phỏng) Câu hỏi hay! Trong bản thật, AI Tutor trả lời dựa trên đáp án kiểm duyệt và giải thích của câu này, và sẽ nói rõ nếu không chắc chắn.';
    if (r==='__REC__') { T.messages.push({from:'tutor',text:'Mình chọn từ ngân hàng câu hỏi đã kiểm duyệt (không tự bịa câu mới) để bạn luyện đúng kỹ năng Giới từ:'}); T.messages.push({from:'tutor',rec:true}); }
    else T.messages.push({from:'tutor',text:r});
    render(); const c=document.querySelector('[data-scroll="content"]'); if(c) c.scrollTop=c.scrollHeight; },1100);
}

/* =========================================================================
   EVENTS
   ========================================================================= */
document.addEventListener('click',ev=>{
  const dsLink=ev.target.closest('[data-ds]'); if (dsLink){ ev.preventDefault(); const t=document.getElementById(dsLink.dataset.ds), vp=document.getElementById('viewport'); if(t) vp.scrollTo({top:vp.scrollTop+t.getBoundingClientRect().top-vp.getBoundingClientRect().top-16,behavior:'smooth'}); return; }
  const el=ev.target.closest('[data-action]'); if(!el||el.disabled) return;
  const act=el.dataset.action; if(!act||!A[act]) return;
  if (el.tagName==='A') ev.preventDefault();
  if (act!=='overlayClose' && ev.target.closest('[data-stop]') && !el.closest('[data-stop]')) return;
  A[act]({...el.dataset},el,ev);
});
document.addEventListener('keydown',ev=>{
  if ((ev.key==='Enter'||ev.key===' ') && ev.target.matches('tr[data-action]')) { ev.preventDefault(); ev.target.click(); return; }
  if (ev.key==='Escape' && (S.modal||S.sheet) && !(S.modal&&S.modal.type==='grading')) { S.modal=null; S.sheet=null; render(); return; }
  if (ev.key==='Enter' && ev.target.id==='tutor-input') { A.tutorSend(); return; }
  if (S.screen!=='exam'||!S.exam||S.modal||S.sheet||isM()) return;
  const t=ev.target; if (t.matches('input[type=text],input:not([type]),textarea,select') || (t.matches('input[type=radio]')&&ev.key.startsWith('Arrow'))) return;
  if (ev.metaKey||ev.ctrlKey||ev.altKey) return;
  const E=S.exam, qid=E.qids[E.idx], q=Q[qid];
  if (ev.key==='ArrowRight'){ ev.preventDefault(); A.qNext(); }
  else if (ev.key==='ArrowLeft'){ ev.preventDefault(); A.qPrev(); }
  else if (ev.key.toLowerCase()==='f'){ A.flag(); }
  else if (/^[a-d]$/i.test(ev.key) && q.options){ const o=q.options[ev.key.toUpperCase().charCodeAt(0)-65]; const locked=E.mode==='practice'&&E.checked[qid]; if(o&&!locked){ setAnswer(qid,o[0]); if(document.activeElement) document.activeElement.blur(); render(); } }
});
document.addEventListener('change',ev=>{
  const el=ev.target, k=el.dataset.input; if(!k) return;
  if (k==='answer'){ setAnswer(el.dataset.q,el.value); render(); }
  if (k==='rights'){ S.lib.rights=el.value; render(); }
  if (k==='rightsOk'){ S.lib.rightsOk=el.checked; render(); }
});
document.addEventListener('input',ev=>{
  const el=ev.target, k=el.dataset.input; if(!k) return;
  if (k==='blank'){ setAnswer(el.dataset.q,el.value); const b=document.querySelector('[data-action="check"]'); if(b) b.disabled=!el.value.trim(); }
  if (k==='writing'){ S.writing.text=el.value; const wc=words(el.value), target=S.writing.mobileMode==='intro'?50:250, c=document.getElementById('w-count'); if(c){ c.textContent=`${wc} / ${target} từ`; c.className=`tnum font-medium ${wc>=target?'text-success':'text-muted'}`; } }
  if (k==='tutorDraft'){ S.tutor.draft=el.value; }
  if (k==='authEmail'){ S.auth.email=el.value; }
  if (k==='catQ'){ S.catalog.q=el.value; render(); }
});

/* Clocks: exam timer (server-authoritative in production), audio simulation, writing/speaking timers */
setInterval(()=>{
  const E=S.exam;
  if (E && !E.submitted && S.screen==='exam'){
    if (E.mode==='mock'){ E.remaining--; if (E.remaining<=0){ E.remaining=0; submitExam('time_expired'); return; } }
    else E.elapsed++;
    const t=document.getElementById('exam-timer');
    if (t){ t.querySelector('span').textContent=fmt(E.mode==='mock'?E.remaining:E.elapsed); if(E.mode==='mock'){ t.classList.toggle('is-warn',E.remaining<=300&&E.remaining>60); t.classList.toggle('is-danger',E.remaining<=60); } }
  } else if (E && E.mode==='mock' && !E.submitted) { E.remaining=Math.max(0,E.remaining-1); }
  if (S.resume && S.resume.mode==='mock' && !(E&&E.examId===S.resume.examId)) S.resume.remaining=Math.max(0,S.resume.remaining-1);
  const W=S.writing; if (W && S.screen==='writing' && W.phase==='editing' && (!isM()||W.mobileMode)){ W.remaining=Math.max(0,W.remaining-1); const t=document.getElementById('w-timer'); if(t) t.querySelector('span').textContent=fmt(W.remaining); }
  const P=S.speaking; if (P && S.screen==='speaking' && (P.phase==='prep'||P.phase==='recording')){ P.t++;
    if (P.phase==='prep'&&P.t>=60){ P.phase='recording'; P.t=0; render(); }
    else if (P.phase==='recording'&&P.t>=120){ P.phase='recorded'; render(); }
    else if (P.phase==='recording') render();
    else { const t=document.getElementById('spk-timer'); if(t) t.querySelector('span').textContent=fmt(60-P.t); const pr=document.getElementById('spk-prep'); if(pr) pr.innerHTML=progressBar(P.t,60,{label:'Thời gian chuẩn bị',right:`còn ${60-P.t}s`}); } }
},1000);
setInterval(()=>{
  const E=S.exam; if(!E) return; let changed=false;
  for (const k in E.audio){ const a=E.audio[k]; if(a.s==='playing'){ const dur=(G[k]&&G[k].audioSec)||(Q[k]&&Q[k].audioSec)||5; a.p=Math.min(1,a.p+0.2/dur); if(a.p>=1) a.s='done'; changed=true; } }
  if (changed && S.screen==='exam') render();
},200);

render(true);
</script>
