<title>Engrisk — UX Preview · HeroUI v3 theme</title>
<!--
  Engrisk UX preview — product review artifact, NOT production code. Open this file directly (no build step).
  Source of truth: HeroUI v3 — https://heroui.com/en/themes (Theme Builder presets Default/Sky/Lavender/Mint/Rabbit,
  Inter, Radius Medium, Radius form Large) + @heroui/styles. Icons: Gravity UI (MIT).
  All data is deterministic mock data; auth, AI, uploads, grading and persistence are SIMULATED.
  Files:
    styles/tokens.css      HeroUI tokens + Theme Builder presets ([data-palette] × [data-theme])
    styles/components.css  HeroUI component styles (BEM names of @heroui/styles)
    styles/patterns.css    Engrisk patterns, mascot "Pip", motion system
    styles/layout.css      review chrome, device frames, app shells, page compositions
    scripts/icons.js       Gravity UI icon data
    scripts/i18n.js        languages + T()/tx() helpers + Intl formatting
    scripts/data.js        mock content, exams, screen registry, palettes
    scripts/ui.js          component helpers, mascot, language & appearance pickers
    scripts/screens-*.js   one render function per screen
    scripts/app.js         state, shells, overlays, render loop, actions, events
  Companion docs: product_flow.md · ux_spec.md · backend/docs_design/schema.dbml
-->
